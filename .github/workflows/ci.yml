name: App checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'
  FLUTTER_REVISION: abaf9c523780a608bd46686fd5e53740a07077f8
  GO_VERSION: '1.27.3'
  JAVA_VERSION: '21.0.13+9'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  checks:
    name: Source and unsigned bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select applicable checks
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tool.ci_scope_test
          python3 tool/ci_scope.py select --event "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" --output "$RUNNER_TEMP/quietake-scope.json"
      - name: Check non-app content
        id: content
        if: steps.scope.outputs.mode == 'non-app'
        run: python3 tool/ci_scope.py check-content "$RUNNER_TEMP/quietake-scope.json"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.scope.outputs.mode == 'full'
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.mode == 'full'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.scope.outputs.mode == 'full'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: steps.scope.outputs.mode == 'full'
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false
      - name: Verify toolchain and install build prerequisites
        if: steps.scope.outputs.mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = "$FLUTTER_REVISION"
          sudo apt-get update
          sudo apt-get install -y libsodium-dev libglu1-mesa
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/quietake-bin"
          cat > "$RUNNER_TEMP/quietake-bin/bundletool" <<'SH'
          #!/usr/bin/env bash
          exec java -jar "$RUNNER_TEMP/bundletool.jar" "$@"
          SH
          chmod +x "$RUNNER_TEMP/quietake-bin/bundletool"
          echo "$RUNNER_TEMP/quietake-bin" >> "$GITHUB_PATH"
      - name: Check committed source and unsigned bundle
        if: steps.scope.outputs.mode == 'full'
        id: full
        shell: bash
        run: |
          set -euo pipefail
          source_root=$(mktemp -d /tmp/quietake-ci.XXXXXX)
          git archive HEAD | tar -x -C "$source_root"
          cd "$source_root"
          test ! -e android/key.properties
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub
          python3 -m unittest discover -s tool -p '*_test.py'
          (cd recover && test -z "$(gofmt -l .)" && go vet ./... && go test ./...)
          dart run tool/check_interop.dart
          # Pub-enabled builds regenerate the registrant without dev-only plugins.
          flutter build appbundle --release --target=lib/main.dart \
            --obfuscate --split-debug-info=build/private-symbols
          (cd android && ./gradlew :app:testDebugUnitTest --no-daemon)
          python3 tool/check_bundle.py build/app/outputs/bundle/release/app-release.aab \
            --application-id cam.quietake.app --expect-unsigned --forbid-text /Users/
          # No binaries, symbols or raw logs are published as workflow artifacts.

      - name: Require selected checks to complete
        if: always()
        env:
          CHECK_MODE: ${{ steps.scope.outputs.mode }}
          SELECTION_RESULT: ${{ steps.scope.outcome }}
          CONTENT_RESULT: ${{ steps.content.outcome }}
          FULL_RESULT: ${{ steps.full.outcome }}
        run: python3 tool/ci_scope.py complete "$CHECK_MODE" "$SELECTION_RESULT" "$CONTENT_RESULT" "$FULL_RESULT"

  android:
    name: Android integration
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select applicable checks
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tool.ci_scope_test
          python3 tool/ci_scope.py select --event "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" --output "$RUNNER_TEMP/quietake-scope.json"
      - name: Check non-app content
        id: content
        if: steps.scope.outputs.mode == 'non-app'
        run: python3 tool/ci_scope.py check-content "$RUNNER_TEMP/quietake-scope.json"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.scope.outputs.mode == 'full'
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.scope.outputs.mode == 'full'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: steps.scope.outputs.mode == 'full'
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false
      - name: Prepare isolated emulator checks
        if: steps.scope.outputs.mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = "$FLUTTER_REVISION"
          sudo apt-get update
          sudo apt-get install -y libpulse0
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          flutter pub get --enforce-lockfile
          free -m
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        if: steps.scope.outputs.mode == 'full'
        id: full
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          avd-name: quietake
          profile: pixel_6
          ram-size: 2048M
          disk-size: 6G
          pre-emulator-launch-script: |
            "$ANDROID_HOME/emulator/emulator" -version
            python3 tool/emulator_exit_trace.py install "$ANDROID_HOME" "$RUNNER_TEMP/quietake-emulator-logs"
            "$ANDROID_HOME/emulator/emulator" -version
            touch "$RUNNER_TEMP/quietake-emulator-trace-ready"
          # Preserve guest shutdown/panic output in the separate diagnostic log.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated -show-kernel
          disable-animations: true
          script: test -f "$RUNNER_TEMP/quietake-emulator-trace-ready" && tool/e2e.sh android
      - name: Emulator diagnostic log
        if: always() && steps.scope.outputs.mode == 'full'
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: |
          # Synthetic emulator stdout/stderr only, never app data or memory dumps.
          for log in "$RUNNER_TEMP/quietake-emulator-logs"/emulator-*.log; do
            [ -f "$log" ] || continue
            echo "::group::$(basename "$log")"
            stop_token=$(python3 -c 'import uuid; print(uuid.uuid4().hex)')
            echo "::stop-commands::$stop_token"
            cat "$log"
            printf '\n::%s::\n' "$stop_token"
            echo '::endgroup::'
          done
      - name: Report emulator host diagnostics
        if: always() && steps.scope.outputs.mode == 'full'
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: |
          # Synthetic hosted runner only. No app data, environment or credentials.
          set +e
          free -m
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          ps -eo pid,comm,rss --sort=-rss | head -n 16
          cat /proc/pressure/memory
          sudo dmesg --color=never | grep -Ei 'out of memory|oom-kill|killed process|segfault|qemu|kvm' | tail -n 60
          # Crash database metadata only: never print or upload memory dumps.
          find /tmp/android-runner -maxdepth 4 -type f \( -name '*.dmp' -o -name '*.meta' \) \
            -printf 'emulator-crash-file %f bytes=%s\n' 2>/dev/null | head -n 40
          exit 0

      - name: Require selected checks to complete
        if: always()
        env:
          CHECK_MODE: ${{ steps.scope.outputs.mode }}
          SELECTION_RESULT: ${{ steps.scope.outcome }}
          CONTENT_RESULT: ${{ steps.content.outcome }}
          FULL_RESULT: ${{ steps.full.outcome }}
        run: python3 tool/ci_scope.py complete "$CHECK_MODE" "$SELECTION_RESULT" "$CONTENT_RESULT" "$FULL_RESULT"
