name: Diagnostic emulator crash probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'
  FLUTTER_REVISION: abaf9c523780a608bd46686fd5e53740a07077f8
  GO_VERSION: '1.27.3'
  JAVA_VERSION: '21.0.13+9'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  android:
    name: Emulator crash probe (not acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false
      - name: Prepare isolated emulator checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = "$FLUTTER_REVISION"
          sudo apt-get update
          sudo apt-get install -y libpulse0 gdb
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          flutter pub get --enforce-lockfile
          free -m
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        id: full
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          avd-name: quietake
          profile: pixel_6
          ram-size: 2048M
          disk-size: 6G
          pre-emulator-launch-script: |
            "$ANDROID_HOME/emulator/emulator" -version | grep -F '37.2.13.0 (build_id 16740729)'
            python3 tool/emulator_exit_trace.py install "$ANDROID_HOME" "$RUNNER_TEMP/quietake-emulator-logs"
            "$ANDROID_HOME/emulator/emulator" -version
            touch "$RUNNER_TEMP/quietake-emulator-trace-ready"
          # Preserve guest shutdown/panic output in the separate diagnostic log.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated -show-kernel
          disable-animations: true
          script: bash tool/emulator_crash_probe.sh
      - name: Emulator diagnostic log
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: |
          # Synthetic emulator stdout/stderr only, never app data or memory dumps.
          for log in "$RUNNER_TEMP/quietake-emulator-logs"/emulator-*.log; do
            [ -f "$log" ] || continue
            echo "::group::$(basename "$log")"
            stop_token=$(python3 -c 'import uuid; print(uuid.uuid4().hex)')
            echo "::stop-commands::$stop_token"
            cat "$log"
            printf '\n::%s::\n' "$stop_token"
            echo '::endgroup::'
          done
      - name: Report emulator host diagnostics
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: |
          # Synthetic hosted runner only. No app data, environment or credentials.
          set +e
          free -m
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          ps -eo pid,comm,rss --sort=-rss | head -n 16
          cat /proc/pressure/memory
          sudo dmesg --color=never | grep -Ei 'out of memory|oom-kill|killed process|segfault|qemu|kvm' | tail -n 60
          # Crash database metadata only: never print or upload memory dumps.
          find /tmp/android-runner -maxdepth 4 -type f \( -name '*.dmp' -o -name '*.meta' \) \
            -printf 'emulator-crash-file %f bytes=%s\n' 2>/dev/null | head -n 40
          exit 0

      - name: Native stack diagnostics
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: |
          test ! -f "$RUNNER_TEMP/quietake-native-stack.log" || cat "$RUNNER_TEMP/quietake-native-stack.log"
