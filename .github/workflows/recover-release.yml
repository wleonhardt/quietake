name: Recovery tool binaries

# Builds quietake-recover for a published release and attaches the binaries with
# their checksums, so recovering a backup needs no Go install. Nothing runs
# until the owner publishes a release.
on:
  release:
    types: [published]

permissions:
  contents: write

env:
  GO_VERSION: '1.27.3'

jobs:
  binaries:
    name: Build and attach quietake-recover
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Test, build and checksum
        shell: bash
        working-directory: recover
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go mod verify
          go vet ./...
          go test ./...
          mkdir -p "$RUNNER_TEMP/out"
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            name="quietake-recover-$os-$arch"
            if [ "$os" = windows ]; then name="$name.exe"; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags='-s -w' \
              -o "$RUNNER_TEMP/out/$name" .
          done
          (cd "$RUNNER_TEMP/out" && sha256sum quietake-recover-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/out/* --repo "$GITHUB_REPOSITORY"
